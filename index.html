<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Dokumen Kependudukan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library untuk PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.autotable.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; }
        .custom-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-400">Data Administrasi Dokumen</h1>
            <p id="tanggalDisplay" class="text-gray-500 mt-2 italic"></p>
        </header>

        <div class="custom-glass p-6 rounded-2xl border border-gray-800 mb-8">
            <h2 class="text-xl font-semibold mb-4">Tambah/Edit Data</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="namaInput" placeholder="Nama Lengkap" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                <select id="jenisInput" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="Akta Kelahiran">Akta Kelahiran</option>
                    <option value="Akta Kematian">Akta Kematian</option>
                    <option value="Kartu Keluarga">Kartu Keluarga</option>
                    <option value="KTP">KTP</option>
                </select>
                <input type="number" id="hargaInput" placeholder="Harga Dasar (Rp)" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                <input type="number" id="penguranganInput" placeholder="Pengurangan (Rp)" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                <input type="number" id="penambahanInput" placeholder="Penambahan (Rp)" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                <select id="statusInput" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="Belum Lunas">Belum Lunas</option>
                    <option value="Lunas">Lunas</option>
                </select>
                <button onclick="addData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition">Simpan Data</button>
                <button onclick="downloadPDF()" class="bg-green-600 hover:bg-green-700 text-white font-bold p-3 rounded-lg transition">Unduh PDF</button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">Daftar Dokumen</h2>
            <div class="text-lg font-bold bg-gray-800 px-4 py-2 rounded-full border border-blue-900">
                Total Keseluruhan: <span id="totalHarga" class="text-blue-400">Rp 0</span>
            </div>
        </div>

        <div class="custom-glass rounded-2xl overflow-x-auto border border-gray-800">
            <table class="w-full text-left">
                <thead class="bg-gray-900">
                    <tr>
                        <th class="p-4">Nama</th>
                        <th class="p-4">Jenis</th>
                        <th class="p-4 text-right">Harga</th>
                        <th class="p-4 text-right">Kurang</th>
                        <th class="p-4 text-right">Tambah</th>
                        <th class="p-4 text-right">Total</th>
                        <th class="p-4 text-center">Status</th>
                        <th class="p-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('tanggalDisplay').innerText = new Date().toLocaleDateString('id-ID', options);

        let dataList = JSON.parse(localStorage.getItem('dokumenData')) || [];

        function renderData() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';
            let grandTotal = 0;

            dataList.forEach((item, index) => {
                const harga = parseInt(item.harga) || 0;
                const kurang = parseInt(item.pengurangan) || 0;
                const tambah = parseInt(item.penambahan) || 0;
                const status = item.status || 'Belum Lunas';
                const rowTotal = harga - kurang + tambah;
                grandTotal += rowTotal;

                tbody.innerHTML += `
                    <tr class="border-b border-gray-800 hover:bg-gray-800/50 transition">
                        <td class="p-4">${item.nama}</td>
                        <td class="p-4 text-blue-300">${item.jenis}</td>
                        <td class="p-4 text-right">Rp ${harga.toLocaleString()}</td>
                        <td class="p-4 text-right text-red-400">- Rp ${kurang.toLocaleString()}</td>
                        <td class="p-4 text-right text-green-400">+ Rp ${tambah.toLocaleString()}</td>
                        <td class="p-4 text-right font-bold text-white">Rp ${rowTotal.toLocaleString()}</td>
                        <td class="p-4 text-center">
                            <span class="${status === 'Lunas' ? 'text-green-500' : 'text-orange-500'} font-bold">${status}</span>
                        </td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="editData(${index})" class="text-yellow-500 hover:text-yellow-300 font-bold">Edit</button>
                            <button onclick="deleteData(${index})" class="text-red-500 hover:text-red-300 font-bold">Hapus</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('totalHarga').innerText = `Rp ${grandTotal.toLocaleString()}`;
            localStorage.setItem('dokumenData', JSON.stringify(dataList));
        }

        function addData() {
            const nama = document.getElementById('namaInput').value;
            const jenis = document.getElementById('jenisInput').value;
            const harga = document.getElementById('hargaInput').value || 0;
            const pengurangan = document.getElementById('penguranganInput').value || 0;
            const penambahan = document.getElementById('penambahanInput').value || 0;
            const status = document.getElementById('statusInput').value;

            if (nama) {
                dataList.push({ nama, jenis, harga, pengurangan, penambahan, status });
                document.getElementById('namaInput').value = '';
                document.getElementById('hargaInput').value = '';
                document.getElementById('penguranganInput').value = '';
                document.getElementById('penambahanInput').value = '';
                renderData();
            }
        }

        function editData(index) {
            const item = dataList[index];
            document.getElementById('namaInput').value = item.nama;
            document.getElementById('jenisInput').value = item.jenis;
            document.getElementById('hargaInput').value = item.harga;
            document.getElementById('penguranganInput').value = item.pengurangan;
            document.getElementById('penambahanInput').value = item.penambahan;
            document.getElementById('statusInput').value = item.status;
            
            deleteData(index);
        }

        function deleteData(index) {
            dataList.splice(index, 1);
            renderData();
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text("Laporan Administrasi Dokumen", 14, 20);
            doc.setFontSize(10);
            doc.text(`Tanggal: ${new Date().toLocaleDateString('id-ID')}`, 14, 28);

            const tableColumn = ["Nama", "Jenis", "Harga", "Kurang", "Tambah", "Total", "Status"];
            const tableRows = [];

            dataList.forEach(item => {
                const h = parseInt(item.harga) || 0;
                const k = parseInt(item.pengurangan) || 0;
                const t = parseInt(item.penambahan) || 0;
                const total = h - k + t;
                tableRows.push([
                    item.nama,
                    item.jenis,
                    `Rp ${h.toLocaleString()}`,
                    `Rp ${k.toLocaleString()}`,
                    `Rp ${t.toLocaleString()}`,
                    `Rp ${total.toLocaleString()}`,
                    item.status
                ]);
            });

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 35,
                theme: 'striped',
                styles: { fontSize: 8 }
            });

            doc.save("Laporan_Dokumen.pdf");
        }

        renderData();
    </script>
</body>
</html>
